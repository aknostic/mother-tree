services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: mothertree
      POSTGRES_PASSWORD: mothertree
      POSTGRES_DB: mothertree
    volumes:
      - mother-tree-pgdata:/var/lib/postgresql/data
      - ./deploy/database/00-init-functions.sql:/docker-entrypoint-initdb.d/00-init-functions.sql:ro
      - ./deploy/database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mothertree"]
      interval: 5s
      timeout: 5s
      retries: 10

  graphql:
    build:
      context: ./deploy/graphql
    environment:
      DATABASE_URL: postgresql://mothertree:mothertree@db:5432/mothertree
      ADMIN_SECRET: ${ADMIN_SECRET:-}
      PORT: "5000"
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >
          node -e "require('http').get('http://localhost:5000/healthz', r => {
            process.exit(r.statusCode === 200 ? 0 : 1)
          }).on('error', () => process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 12

  bot:
    build:
      context: ./jobs
      dockerfile: Dockerfile.bot
    environment:
      HASURA_URL: http://graphql:5000/graphql
      HASURA_ADMIN_SECRET: ${ADMIN_SECRET:-}
      SCALEWAY_AI_API_KEY: ${SCALEWAY_AI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_APP_TOKEN: ${SLACK_APP_TOKEN:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ORGANIZATION_NAME: ${ORGANIZATION_NAME:-}
    depends_on:
      graphql:
        condition: service_healthy
    restart: on-failure:3

volumes:
  mother-tree-pgdata: {}

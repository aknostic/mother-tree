apiVersion: batch/v1
kind: CronJob
metadata:
  name: discipline-calendar-sync
  namespace: mother-tree
spec:
  schedule: "0 6 * * 1-5" # 06:00 UTC = 07:00 CET weekdays (before stale check)
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 7200
      backoffLimit: 1
      template:
        spec:
          imagePullSecrets:
            - name: gitlab-registry
          containers:
            - name: calendar-sync
              # TODO: replace <your-org> with your container registry path before deploying
              image: ghcr.io/<your-org>/mother-tree-jobs:latest
              args: ["discipline", "calendar"]
              env:
                - name: HASURA_URL
                  value: "http://graphql:5000/graphql"
                - name: HASURA_ADMIN_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: hasura-admin-secret
                      key: admin-secret
                - name: SCALEWAY_AI_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: scaleway-ai
                      key: secret-key
                - name: ANTHROPIC_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: anthropic-api
                      key: api-key
                - name: SLACK_BOT_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: slack-credentials
                      key: bot-token
              resources:
                requests: {cpu: 50m, memory: 128Mi}
                limits: {cpu: 500m, memory: 256Mi}
          restartPolicy: Never

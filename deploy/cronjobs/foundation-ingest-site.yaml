apiVersion: batch/v1
kind: CronJob
metadata:
  name: foundation-ingest-site
  namespace: mother-tree
spec:
  schedule: "30 2 * * 0" # Weekly Sunday 02:30
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 7200
      backoffLimit: 1
      template:
        spec:
          imagePullSecrets:
            - name: gitlab-registry
          containers:
            - name: ingest
              image: registry.gitlab.aknostic.com/aknostic/mother-tree/jobs:20260511125512-724a4af3 # {"$imagepolicy": "mother-tree:jobs"}
              args: ["ingest", "foundation", "sitemap", "https://aknostic.com/sitemap.xml"]
              env:
                - name: HASURA_URL
                  value: "http://graphql:5000/graphql"
                - name: HASURA_ADMIN_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: hasura-admin-secret
                      key: admin-secret
                - name: SCALEWAY_AI_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: scaleway-ai
                      key: secret-key
                - name: ANTHROPIC_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: anthropic-api
                      key: api-key
                - name: ORGANIZATION_NAME
                  value: "Aknostic"
              resources:
                requests: {cpu: 100m, memory: 256Mi}
                limits: {cpu: "1", memory: 512Mi}
          restartPolicy: Never

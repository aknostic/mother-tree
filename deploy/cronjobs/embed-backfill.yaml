apiVersion: batch/v1
kind: Job
metadata:
  name: embed-backfill
  namespace: mother-tree
spec:
  ttlSecondsAfterFinished: 7200
  backoffLimit: 1
  template:
    spec:
      imagePullSecrets:
        - name: gitlab-registry
      containers:
        - name: embed-backfill
          # TODO: replace <your-org> with your container registry path before deploying
          image: ghcr.io/<your-org>/mother-tree-jobs:latest
          args: ["embed", "backfill"]
          env:
            - name: HASURA_URL
              value: "http://graphql:5000/graphql"
            - name: HASURA_ADMIN_SECRET
              valueFrom:
                secretKeyRef:
                  name: hasura-admin-secret
                  key: admin-secret
            - name: SCALEWAY_AI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: scaleway-ai
                  key: secret-key
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
      restartPolicy: Never
